name: Validate and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and normalize uploaded phone media
        run: |
          if [ -f FoundPhone-assets-upload.zip ]; then
            rm -rf /tmp/phone-assets-unpack
            mkdir -p /tmp/phone-assets-unpack public/assets
            unzip -oq FoundPhone-assets-upload.zip -d /tmp/phone-assets-unpack
            # The supplied archive wraps its payload in FoundPhone-assets-upload/assets/.
            if [ -d /tmp/phone-assets-unpack/FoundPhone-assets-upload/assets ]; then
              cp -a /tmp/phone-assets-unpack/FoundPhone-assets-upload/assets/. public/assets/
            elif [ -d /tmp/phone-assets-unpack/assets ]; then
              cp -a /tmp/phone-assets-unpack/assets/. public/assets/
            else
              echo "Could not find an assets/ directory inside FoundPhone-assets-upload.zip" >&2
              find /tmp/phone-assets-unpack -maxdepth 3 -type d -print
              exit 1
            fi
          else
            echo "FoundPhone-assets-upload.zip is missing from the repository root" >&2
            exit 1
          fi

          # The two Moments photos are stored at the assets root in the uploaded archive.
          mkdir -p public/assets/moments
          if [ -f "public/assets/微信朋友圈封面.jpg" ]; then
            cp "public/assets/微信朋友圈封面.jpg" public/assets/moments/moments-cover.jpg
          fi
          if [ -f "public/assets/朋友圈配图拍你一辈子.jpg" ]; then
            cp "public/assets/朋友圈配图拍你一辈子.jpg" public/assets/moments/moments-post-camera.jpg
          fi

          # Map the supplied avatar references to the story paths.
          mkdir -p public/assets/avatars public/assets/douban
          if [ -f public/assets/avatars/111.png ]; then
            cp public/assets/avatars/111.png public/assets/avatars/weibo-avatar.jpg
          fi
          if [ -f public/assets/avatars/222.jpg ]; then
            cp public/assets/avatars/222.jpg public/assets/avatars/wechat-avatar.jpg
          fi
          if [ -f public/assets/douban/2.jpg ]; then
            cp public/assets/douban/2.jpg public/assets/douban/group-reference.jpg
          fi

          # Normalize user-supplied filenames to the paths referenced by the story.
          if [ -d public/assets/audio ]; then
            audio_file="$(find public/assets/audio -maxdepth 1 -type f \( -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.wav' \) | head -n 1)"
            if [ -n "$audio_file" ]; then
              if [ "$audio_file" != "public/assets/audio/day-by-day.m4a" ]; then cp "$audio_file" public/assets/audio/day-by-day.m4a; fi
            fi
          fi

          if [ -d public/assets/gallery ]; then
            mapfile -d '' gallery_files < <(find public/assets/gallery -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 | sort -z)
            index=1
            for file in "${gallery_files[@]}"; do
              target="$(printf 'public/assets/gallery/%02d.jpg' "$index")"
              if [ "$file" != "$target" ]; then cp "$file" "$target"; fi
              index=$((index + 1))
            done
          fi

          if [ -d public/assets/video ]; then
            video_file="$(find public/assets/video -maxdepth 1 -type f \( -iname '*.mov' -o -iname '*.mp4' -o -iname '*.webm' \) | head -n 1)"
            if [ -n "$video_file" ]; then
              if [ "$video_file" != "public/assets/video/photos-clip.mov" ]; then cp "$video_file" public/assets/video/photos-clip.mov; fi
            fi
          fi
      - name: Verify every uploaded phone asset
        run: |
          required=(
            public/assets/audio/day-by-day.m4a
            public/assets/avatars/weibo-avatar.jpg
            public/assets/avatars/wechat-avatar.jpg
            public/assets/douban/group-reference.jpg
            public/assets/moments/moments-cover.jpg
            public/assets/moments/moments-post-camera.jpg
            public/assets/video/photos-clip.mov
            public/assets/su.jpg
          )
          for n in $(seq -w 1 11); do required+=("public/assets/gallery/$n.jpg"); done
          missing=0
          for file in "${required[@]}"; do
            if [ ! -s "$file" ]; then
              echo "MISSING OR EMPTY: $file" >&2
              missing=1
            else
              echo "OK: $file ($(stat -c%s "$file") bytes)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required phone assets were not extracted correctly." >&2
            exit 1
          fi
          echo "All phone images, avatars, video, audio and wallpaper are present."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run story:validate
      - run: npm run story:test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
